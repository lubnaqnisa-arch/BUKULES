<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Les</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gabarito:wght@500;600;700&display=swap" rel="stylesheet">
<style id="invcss"></style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F4F6F1;--surface:#FFFFFF;--ink:#1B2340;--muted:#5C6482;--line:#D9DED1;--hair:#E7EBE0;
  --brand:#2B4BB8;--on-brand:#FFFFFF;--hl:#FFE45C;--hl-soft:#FFF5BD;
  --warn:#B72A48;--warn-bg:#FFE6EB;--ok:#1B7A51;--ok-bg:#DFF3E7;--info:#2B4BB8;--info-bg:#E4EAFB;
  --grid:rgba(43,75,184,.055);--shadow:0 16px 40px -18px rgba(27,35,64,.45);
  --s0:#F0A92E;--s1:#4F86F0;--s2:#E45E86;--s3:#2FB183;--s4:#8F6FDB;--s5:#EE8244;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12162B;--surface:#1A2040;--ink:#EDF0FB;--muted:#A5ACCB;--line:#2F3862;--hair:#262E55;
    --brand:#8AA4FF;--on-brand:#0E1330;--hl:#F2D64A;--hl-soft:#3A3614;
    --warn:#FF93A8;--warn-bg:#42202B;--ok:#58D6A1;--ok-bg:#173B2E;--info:#9DB3FF;--info-bg:#232C5C;
    --grid:rgba(138,164,255,.07);--shadow:0 16px 40px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --paper:#12162B;--surface:#1A2040;--ink:#EDF0FB;--muted:#A5ACCB;--line:#2F3862;--hair:#262E55;
  --brand:#8AA4FF;--on-brand:#0E1330;--hl:#F2D64A;--hl-soft:#3A3614;
  --warn:#FF93A8;--warn-bg:#42202B;--ok:#58D6A1;--ok-bg:#173B2E;--info:#9DB3FF;--info-bg:#232C5C;
  --grid:rgba(138,164,255,.07);--shadow:0 16px 40px -18px rgba(0,0,0,.75);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)}
.h1{font:700 30px/1.15 Gabarito,Figtree,system-ui,sans-serif;letter-spacing:-.01em}
.h2{font:600 20px/1.25 Gabarito,Figtree,system-ui,sans-serif}
.h3{font:600 16px/1.3 Figtree,system-ui,sans-serif}
small,.small{font-size:13px}

/* layout */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 72%,transparent)}
.brand{padding:0 8px 18px}
.brand b{display:inline-block;font:700 23px/1.2 Gabarito,Figtree,sans-serif;background:var(--hl);color:#1B2340;padding:2px 10px 3px;border-radius:4px 10px 8px 5px / 8px 5px 10px 4px;transform:rotate(-1.2deg)}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;text-align:left}
.nb:hover{background:var(--hair);color:var(--ink)}
.nb[aria-current="page"]{background:var(--hl-soft);color:var(--ink)}
.nav-foot{margin-top:auto;padding:10px 12px;color:var(--muted);font-size:12.5px;line-height:1.4}
.main{padding:28px clamp(16px,4vw,44px) 64px;max-width:1100px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
@media (max-width:860px){
  .app{display:block}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--surface);z-index:20}
  .brand,.nav-foot{display:none}
  .nb{flex-direction:column;justify-content:center;gap:2px;padding:6px 2px;font-size:11.5px;text-align:center;min-width:0;flex:1}
  .main{padding-bottom:120px}
  .h1{font-size:26px}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--hair);filter:none}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--line)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{padding:0;width:38px}
.field{display:grid;gap:5px;margin-bottom:14px;min-width:0}
.field>span{font-weight:600;font-size:14px}
.field small{color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;align-items:start}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--hair);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--info-bg);color:var(--info)}
.err{color:var(--warn);font-weight:600;margin:0 0 10px}
.note{padding:12px 14px;border-radius:10px;background:var(--hl-soft);border:1px solid color-mix(in srgb,var(--hl) 60%,transparent);margin-bottom:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{padding:28px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.empty .btn{margin-top:12px}
.empty b{display:block;color:var(--ink);font:600 18px Gabarito,Figtree,sans-serif;margin-bottom:4px}

/* summary strip + lists */
.strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.strip>div{flex:1 1 190px;padding:14px 18px;display:grid;gap:2px}
.strip>div+div{border-left:1px solid var(--hair)}
.strip b{font:700 24px/1.2 Gabarito,Figtree,sans-serif}
.strip span{color:var(--muted);font-size:13.5px}
@media (max-width:640px){.strip>div+div{border-left:0;border-top:1px solid var(--hair)}}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.list>*+*{border-top:1px solid var(--hair)}
.qrow,.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;color:inherit}
.qrow .qmain,.srow .sinfo{flex:1;min-width:0;display:grid;text-align:left;background:none;border:0;padding:0}
.qmain b,.sinfo b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmain span,.sinfo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13.5px}
.srow:hover{background:var(--hair)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.bar{width:4px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.time{display:grid;min-width:46px;font-weight:700;font-variant-numeric:tabular-nums}
.time small{color:var(--muted);font-weight:500}
.qrow .badge{flex:none}
@media (max-width:640px){.qrow{flex-wrap:wrap}.qrow .qmain{flex-basis:calc(100% - 30px)}.qmain span{white-space:normal}}

/* progress: the highlighter stroke */
.hl-track{position:relative;display:block;height:16px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--hair) 0 1px,transparent 1px 25%)}
.hl-fill{position:absolute;left:0;top:2px;bottom:2px;width:var(--w,0%);border-radius:3px 9px 7px 4px / 7px 4px 9px 3px;background:color-mix(in srgb,var(--c) 78%,transparent);transform:rotate(-.6deg);transform-origin:left center}
.anim .hl-fill{animation:draw .9s cubic-bezier(.2,.75,.2,1) both}
@keyframes draw{from{width:0}}
@media (prefers-reduced-motion:reduce){.anim .hl-fill{animation:none}}

/* students */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.scard{display:grid;gap:12px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit}
.scard:hover{border-color:var(--c)}
.scard .top{display:flex;gap:12px;align-items:center}
.scard h3{font:600 17px/1.25 Gabarito,Figtree,sans-serif}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 18px Gabarito,sans-serif;background:color-mix(in srgb,var(--c) 28%,var(--surface));border:2px solid var(--c)}
.mini{display:grid;gap:7px}
.mini div{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:13px}
.mini em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.subj{margin-bottom:22px}
.subj-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.topic{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(80px,2fr) 92px auto;grid-template-areas:"n b l s";gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair)}
.tname{grid-area:n}.topic .hl-track{grid-area:b}.tlvl{grid-area:l;color:var(--muted);font-size:13px}.step{grid-area:s;display:flex;gap:4px}
.step button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700}
.step button:hover{background:var(--hair)}
@media (max-width:640px){.topic{grid-template-columns:1fr auto;grid-template-areas:"n s" "b b" "l l"}}
.topic-add{display:flex;gap:8px;margin-top:10px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--hair);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px Figtree,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px}
.back{display:inline-flex;align-items:center;gap:4px;margin:-6px 0 12px;padding:4px 8px 4px 2px;border:0;background:none;color:var(--muted);font-weight:600}
.und{display:inline-flex;gap:3px;vertical-align:middle}
.und i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.und i.on{background:var(--brand)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head .h2{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dow{padding:8px 6px;text-align:center;font-weight:600;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--hair)}
.cell{position:relative;min-height:92px;padding:6px;border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:none;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch;color:inherit}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--hair)}
.cell.off{opacity:.45}
.cell .num{font-weight:600;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:8px 6px 8px 5px}
.cell.today .num{background:var(--hl);color:#1B2340}
.cell.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.chip{display:block;padding:1px 6px;border-radius:5px;font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:3px solid var(--c)}
.more{font-size:12px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
@media (max-width:640px){.cell{min-height:56px;padding:4px}.chips{display:none}.dots{display:flex}}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;background:var(--hair)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hair)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto;min-width:150px}
@media (max-width:640px){.hide-sm{display:none}}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(15,20,45,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{width:min(640px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.modal.wide{width:min(800px,100%)}
.modal:focus{outline:0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--hair)}
.mbody{padding:18px 20px;overflow:auto}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--hair)}
.mfoot .spacer{flex:1}
@media (max-width:640px){
  .backdrop{align-items:end;padding:0}
  .modal{width:100%;max-height:94%;border-radius:16px 16px 0 0}
  .mfoot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}
.sw{position:relative;display:inline-block;margin-right:8px}
.sw input{position:absolute;opacity:0;inset:0;margin:0}
.sw span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--brand);outline-offset:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px;font-weight:600}
.seg input:checked+span{background:var(--hl);color:#1B2340;border-color:var(--hl)}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.steps{list-style:none;padding:0;margin:14px 0 0}
.steps li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--hair)}
.steps .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.steps .mk .ic{width:13px;height:13px;stroke-width:3}
.steps li.done .mk{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.steps li.warn .mk{border-color:var(--warn)}
.dhead{padding-left:12px;border-left:5px solid var(--c);margin-bottom:6px}
.msg{white-space:pre-wrap;min-height:220px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair)}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.chk label{flex:1;display:grid}
.xrow{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:8px}
.totalbar{font:700 18px Gabarito,Figtree,sans-serif;margin-right:auto;align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:80;max-width:min(92vw,480px);font-weight:600;box-shadow:var(--shadow)}
@media (max-width:860px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.tpl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;padding:0;text-decoration:underline}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.recap-ctl{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-bottom:12px}
.recap-month{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:230px;font-weight:700}
.chk-inline{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.chk-inline input{width:18px;height:18px}
.recap-preview{margin-top:4px}
.recap-cv{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
.rep-box{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:14px;background:color-mix(in srgb,var(--hair) 55%,transparent)}
.rep-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.rep-row .rchk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.rep-row .rchk input{width:18px;height:18px}
@media (max-width:640px){.rep-row{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .app,.toast,.mhead,.mfoot{display:none!important}
  .backdrop{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;border:0;max-height:none;width:100%}
  .mbody{overflow:visible;padding:0}
  .inv{border:0}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Menu utama"></nav>
  <main class="main" id="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<noscript>Buku Les membutuhkan JavaScript untuk berjalan.</noscript>

<script>
(function(){
'use strict';

/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const dt=(date,time)=>{const a=date.split('-').map(Number),b=(time||'00:00').split(':').map(Number);return new Date(a[0],a[1]-1,a[2],b[0],b[1]);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtDate=(s,short)=>{const d=parseYmd(s);return short?DAYS[d.getDay()].slice(0,3)+', '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3):DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
const fmtDT=v=>{const d=new Date(v);return fmtDate(ymd(d),true)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const rupiah=n=>'Rp '+Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const sessEnd=s=>new Date(dt(s.date,s.start).getTime()+(s.duration||60)*60000);
const endTime=s=>{const e=sessEnd(s);return pad(e.getHours())+':'+pad(e.getMinutes());};
const startOfWeek=s=>addDays(s,-((parseYmd(s).getDay()+6)%7));
const first=n=>String(n||'').trim().split(/\s+/)[0]||'';
const salam=()=>{const h=new Date().getHours();return h<11?'pagi':h<15?'siang':h<18?'sore':'malam';};
const normPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d;};
const waUrl=(p,t)=>{const n=normPhone(p);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(t):'';};
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(v,k)?v[k]:m);
const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};

function scheduleRender(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0;render();}); }
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3800);}
async function safe(fn,msg){try{return await fn();}catch(e){console.error(e);toast((msg||'Gagal menyimpan')+(e&&e.message?': '+e.message:''));return undefined;}}

const Store={
  db:null,loading:true,chains:{},
  loadLocal(){try{const j=JSON.parse(localStorage.getItem('buku-les.v1')||'null');if(j)COLLS.forEach(k=>{S[k]=j[k]||{};});}catch(e){}},
  saveLocal(){try{localStorage.setItem('buku-les.v1',JSON.stringify(S));}catch(e){}},
  subscribe(){
    let pending=COLLS.length;
    COLLS.forEach(name=>{
      let firstSnap=true;
      this.db.collection(name).onSnapshot(snap=>{
        const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S[name]=m;
        if(firstSnap){firstSnap=false;if(--pending===0)this.loading=false;}
        scheduleRender();
      },err=>{console.error(err);this.loading=false;scheduleRender();toast('Data tidak bisa dimuat dari akun. Muat ulang halaman.');});
    });
  },
  chain(k,fn){
    const run=async()=>{try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*400));return await fn();}throw e;}};
    const p=(this.chains[k]||Promise.resolve()).catch(()=>{}).then(run);this.chains[k]=p;return p;
  },
  put(coll,id,data){
    data=clone(data);S[coll][id]=data;scheduleRender();
    if(!this.db){this.saveLocal();return Promise.resolve();}
    return this.chain(coll+'/'+id,()=>this.db.doc(coll+'/'+id).set(data));
  },
  del(coll,id){
    delete S[coll][id];scheduleRender();
    if(!this.db){this.saveLocal();return Promise.resolve();}
    return this.chain(coll+'/'+id,()=>this.db.doc(coll+'/'+id).delete());
  }
};

function reportDeadline(s){const d=parseYmd(s.date);d.setDate(d.getDate()+1);d.setHours(23,59,59,0);return d;}
function reportState(s){
  if(s.status==='cancelled')return 'na';
  const now=new Date();
  if(sessEnd(s)>now&&s.status!=='done')return 'na';
  const r=s.report,dl=reportDeadline(s);
  if(r&&r.sentAt)return new Date(r.sentAt)<=dl?'sent':'late';
  return now>dl?'overdue':(r?'draft':'todo');
}
const RS={sent:['ok','Laporan terkirim'],late:['warn','Laporan terlambat'],overdue:['warn','Laporan lewat batas'],draft:['info','Draf laporan'],todo:['info','Laporan belum dibuat']};

function sessBadge(x){
  if(x.status==='cancelled')return '<span class="badge">Batal</span>';
  if(x.status==='done'){const r=RS[reportState(x)];return r?'<span class="badge '+r[0]+'">'+r[1]+'</span>':'<span class="badge ok">Selesai</span>';}
  if(sessEnd(x)<=new Date()){const r=RS[reportState(x)];return '<span class="badge info">Belum dicatat</span>';}
  if(x.confirmedAt)return '<span class="badge ok">Dikonfirmasi</span>';
  return '<span class="badge">'+(x.confirmSentAt?'Menunggu balasan':'Belum dikonfirmasi')+'</span>';
}

function buildQueue(){
  const now=new Date(),items=[];
  Object.keys(S.sessions).forEach(id=>{
    const s=S.sessions[id];if(s.status==='cancelled')return;
    const st=S.students[s.studentId];if(!st||st.archived)return;
    const start=dt(s.date,s.start);
    if(s.status==='scheduled'&&start>now){
      if(!s.confirmSentAt)items.push({kind:'confirm',id,s});
      if(!s.reminderSentAt&&now>=new Date(start.getTime()-864e5))items.push({kind:'reminder',id,s});
    }
    const rs=reportState(s);
    if(rs==='todo'||rs==='draft'||rs==='overdue')items.push({kind:'report',id,s,rs});
  });
  const pr=it=>it.kind==='report'&&it.rs==='overdue'?0:it.kind==='reminder'?1:it.kind==='report'?2:3;
  return items.sort((a,b)=>pr(a)-pr(b)||(a.s.date+a.s.start).localeCompare(b.s.date+b.s.start));
}

function chartSVG(series){
  const all=series.reduce((a,s)=>a.concat(s.pts),[]);if(!all.length)return '';
  const W=560,H=190,L=34,R=12,T=12,B=26;
  const t0=Math.min.apply(null,all.map(p=>p.t)),t1=Math.max.apply(null,all.map(p=>p.t));
  const X=t=>t1===t0?(L+(W-L-R)/2):L+(t-t0)/(t1-t0)*(W-L-R),Y=v=>T+(1-v/100)*(H-T-B);
  let g='';
  [0,50,100].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="gl"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="axis">'+v+'</text>';});
  const lab=t=>{const d=new Date(t);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);};
  g+='<text x="'+L+'" y="'+(H-6)+'" class="axis">'+lab(t0)+'</text>';
  if(t1!==t0)g+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" class="axis">'+lab(t1)+'</text>';
  series.forEach(s=>{
    const pts=s.pts.slice().sort((a,b)=>a.t-b.t);
    if(pts.length>1)g+='<polyline fill="none" style="stroke:'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')+'"/>';
    pts.forEach(p=>{g+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5" style="fill:'+s.color+'"><title>'+esc(s.name)+': '+Math.round(p.v)+'%</title></circle>';});
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik perkembangan nilai" class="chart">'+g+'</svg>';
}
function gradeSeries(list){

  if(list.length){
    const ser=F.student?gradeSeries(list):Object.keys(S.students).map((id,i)=>({id,name:S.students[id].name,color:colorOf(id),pts:list.filter(g=>g.studentId===id).map(g=>({t:parseYmd(g.date).getTime(),v:pct(g)}))})).filter(s=>s.pts.length);

     +list.map(g=>'<tr data-act="edit-grade" data-id="'+g.id+'" tabindex="0"><td>'+fmtDate(g.date,true)+'</td><td>'+esc(S.students[g.studentId].name)+'</td><td>'+esc(g.subject||'')+'</td><td>'+esc(g.kind||'')+'</td><td class="hide-sm">'+esc(g.topic||'')+'</td><td class="r">'+g.score+'/'+g.max+'</td><td class="r"><b>'+Math.round(pct(g))+'</b></td></tr>').join('')+'</tbody></table></div>';
  } else h+='<div class="empty" style="margin-top:16px"><b>Belum ada nilai</b>Nilai bisa dicatat dari form laporan sesi, atau langsung di sini.<br><button class="btn" data-act="new-grade" data-student="'+esc(F.student)+'">'+icon('plus')+'Catat nilai</button></div>';

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e2){return false;}
  }
}
async function saveFile(name,data){
  if(DL){
    try{await DL.save({filename:name,data});toast('File siap disimpan.');return true;}
    catch(e){if(!e||e.code!=='declined')toast('Gagal mengunduh'+(e&&e.message?': '+e.message:''));return false;}
  }
  try{
    const ext=(name.split('.').pop()||'').toLowerCase();
    const mime={csv:'text/csv;charset=utf-8',json:'application/json',html:'text/html;charset=utf-8',png:'image/png',pdf:'application/pdf'}[ext]||'application/octet-stream';
    const blob=data instanceof Blob?data:new Blob([data],{type:mime});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},2000);
    toast('File diunduh: '+name);return true;
  }catch(e){toast('Gagal mengunduh'+(e&&e.message?': '+e.message:''));return false;}
}

/* ================= rekap bulanan ================= */
const monthAdd=(mo,n)=>{const p=mo.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);};
const monthLabel=mo=>{const p=mo.split('-').map(Number);return MONTHS[p[1]-1]+' '+p[0];};
const dec=n=>String(Math.round(n*10)/10).replace('.',',');
const uniq=a=>{const seen={},o=[];a.forEach(x=>{const t=String(x==null?'':x).replace(/\s+/g,' ').trim(),k=t.toLowerCase();if(t&&!seen[k]){seen[k]=1;o.push(t);}});return o;};
const joinList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' dan '+a[a.length-1];
const LVCOL=['#C9CFC0','#E45E86','#F0A92E','#4F86F0','#1B7A51'];
const SERC=['#F0A92E','#4F86F0','#E45E86','#2FB183','#8F6FDB','#EE8244'];

function recapData(sid,mo){
  const st=S.students[sid],all=sessList().filter(x=>x.studentId===sid&&x.date.startsWith(mo));
  const done=all.filter(x=>x.status==='done').sort(byTime);
  const gAll=Object.keys(S.grades).map(k=>S.grades[k]).filter(g=>g.studentId===sid);
  const grades=gAll.filter(g=>g.date.startsWith(mo)).sort((a,b)=>a.date.localeCompare(b.date));
  const prev=gAll.filter(g=>g.date.startsWith(monthAdd(mo,-1)));
  const avg=a=>a.length?a.reduce((x,g)=>x+pct(g),0)/a.length:null;
  const reps=done.map(x=>x.report).filter(Boolean);
  const und=reps.map(r=>r.understanding).filter(Boolean);
  const topics=st.topics||[],cnt=[0,0,0,0,0];topics.forEach(t=>{cnt[t.level]++;});
  return {st,mo,done,cancelled:all.filter(x=>x.status==='cancelled').length,
    hours:done.reduce((a,x)=>a+(x.duration||60),0)/60,subjects:uniq(done.map(x=>x.subject)),
    avgUnd:und.length?und.reduce((a,b)=>a+b,0)/und.length:null,
    materi:uniq(done.map(x=>{const r=x.report||{},t=r.covered||x.plan||'';return t?(x.subject?x.subject+' — ':'')+t:'';})),
    good:uniq(reps.map(r=>r.highlights)),needs:uniq(reps.map(r=>r.needs)),
    nextPlan:(done.slice().reverse().map(x=>(x.report||{}).nextPlan).find(Boolean))||'',
    grades,avgGrade:avg(grades),prevAvg:avg(prev),cnt,ntopics:topics.length,mastery:mastery(st),
    strong:topics.filter(t=>t.level>=3).sort((a,b)=>b.level-a.level).map(t=>t.name),
    weak:topics.filter(t=>t.level===1||t.level===2).sort((a,b)=>a.level-b.level).map(t=>t.name)};
}
function recapSummary(d){
  const n=d.done.length;
  if(!n)return 'Belum ada sesi yang selesai pada bulan ini.';
  let s=first(d.st.name)+' mengikuti '+n+' sesi belajar ('+dec(d.hours)+' jam)'+(d.subjects.length?' untuk '+joinList(d.subjects):'')+'.';
  if(d.avgUnd!==null)s+=' Pemahaman selama sesi rata-rata '+UND[Math.round(d.avgUnd)-1].toLowerCase()+'.';
  if(d.avgGrade!==null)s+=' Rata-rata nilai '+Math.round(d.avgGrade)+' dari '+d.grades.length+' penilaian.';
  return s;
}

async function drawRecap(d,o){
  try{await Promise.race([Promise.all([document.fonts.load('600 26px Figtree'),document.fonts.load('700 26px Gabarito')]),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  const K=1.5,W=1240,H=1754,M=72,CW=W-2*M,cv=document.createElement('canvas');
  cv.width=Math.round(W*K);cv.height=Math.round(H*K);
  const c=cv.getContext('2d');c.scale(K,K);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const INK='#1B2340',MUT='#5C6482',HAIR='#DDE1D5',HL='#FFE45C',cf=cfg(),st=d.st;
  const font=(w,s,disp)=>w+' '+s+'px '+(disp?'Gabarito, ':'')+'Figtree, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const T=(s,x,y,f,col,al)=>{c.font=f;c.fillStyle=col||INK;c.textAlign=al||'left';c.textBaseline='alphabetic';c.fillText(String(s),x,y);};
  const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
  const fit=(s,maxW,f)=>{c.font=f;s=String(s);if(c.measureText(s).width<=maxW)return s;while(s.length>1&&c.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s.trim()+'…';};
  const wrap=(s,maxW,f,maxL)=>{
    c.font=f;const words=String(s).split(/\s+/).filter(Boolean),L=[];let cur='';
    words.forEach(w=>{const t=cur?cur+' '+w:w;if(c.measureText(t).width<=maxW||!cur)cur=t;else{L.push(cur);cur=w;}});
    if(cur)L.push(cur);
    if(maxL&&L.length>maxL){L.length=maxL;L[maxL-1]=fit(L[maxL-1]+'…',maxW,f);}
    return L;
  };

  const cells=[[String(d.done.length),'sesi belajar',d.cancelled?d.cancelled+' dibatalkan':''],[dec(d.hours),'jam belajar',''],[d.avgGrade===null?'–':String(Math.round(d.avgGrade)),'rata-rata nilai',delta],[d.avgUnd===null?'–':UND[Math.round(d.avgUnd)-1],'pemahaman','']];

  y+=138;hair(y);y+=22;

  /* resume */

  const two=!!o.donut,lw=two?Math.round(CW*0.56):CW,rx=M+lw+48,rw=CW-lw-48;
  let ly=y+26;
  ly=lines(wrap(recapSummary(d),lw,F26,two?4:3),M,ly,F26,INK,36);
  ly+=16;
  T('Materi yang dipelajari',M,ly,font(600,26),INK);ly+=38;
  if(!d.materi.length){T('Belum ada catatan materi.',M,ly,F25,MUT);ly+=34;}
  else{
    let used=0,shown=0;const cap=two?4:6;
    for(let i=0;i<d.materi.length;i++){

      let a0=-Math.PI/2;const segs=[4,3,2,1,0].filter(lv=>d.cnt[lv]);
      segs.forEach(lv=>{
        const a1=a0+d.cnt[lv]/d.ntopics*Math.PI*2;
        c.beginPath();c.arc(cx,cy,R,a0,a1);c.arc(cx,cy,r,a1,a0,true);c.closePath();c.fillStyle=LVCOL[lv];c.fill();
        if(segs.length>1){c.strokeStyle='#fff';c.lineWidth=3;c.stroke();}

      });
      T(Math.round((d.mastery||0)*100)+'%',cx,cy+8,font(700,38,1),INK,'center');
      T('dikuasai',cx,cy+34,font(400,20),MUT,'center');
      const lx=cx+R+34;

  y=Math.max(ly,ry)+18;

  /* pre-measure the lower blocks so the chart can take the remaining space */
  const good=d.good.length?d.good:d.strong,need=d.needs.length?d.needs:d.weak;
  const colW=(CW-56)/2;
  const blockLines=arr=>{const out=[];arr.slice(0,2).forEach(t=>{out.push(wrap(t,colW-30,F25,2));});return out;};
  const gl=blockLines(good),nlst=blockLines(need);
  const colH=a=>a.reduce((s,L)=>s+L.length*32+8,0);
  const listsH=(good.length||need.length)?72+Math.max(colH(gl),colH(nlst),32)+14:0;
  const note=(o.note||'').trim(),plan=d.nextPlan;
  const noteL=note?wrap(note,CW-34,F26,3):[],planL=plan?wrap('Rencana berikutnya: '+plan,CW-34,F24,2):[];
  const noteH=(note||plan)?46+noteL.length*36+(planL.length?planL.length*32+(noteL.length?8:0):0)+24:0;

  /* grade chart */
  if(o.chart){
    const subs=uniq(d.grades.map(g=>g.subject||'Nilai'));
    T('Grafik nilai',M,y+30,font(600,34,1),INK);
    let lgx=W-M;
    subs.slice().reverse().forEach(s=>{
      const si=subs.indexOf(s),f=font(400,22);c.font=f;const w=c.measureText(s).width;
      T(s,lgx,y+28,f,MUT,'right');lgx-=w+14;

    });
    y+=52;
    if(!d.grades.length){T('Belum ada nilai pada bulan ini.',M,y+26,font(400,26),MUT);y+=60;}
    else{
      const avail=(H-M-34)-y-listsH-noteH-64;
      const ph=Math.max(110,Math.min(280,avail)),px=M+58,pw=CW-58-16,py=y+14;
      [0,50,100].forEach(v=>{const yy=py+ph*(1-v/100);c.fillStyle=HAIR;c.fillRect(px,yy,pw,2);T(v,px-14,yy+7,font(400,20),MUT,'right');});
      const p2=mo=>mo.split('-').map(Number),dim=new Date(p2(d.mo)[0],p2(d.mo)[1],0).getDate();
      [1,8,15,22,dim].forEach(dd=>{T(dd+(dd===1?' '+MONTHS[p2(d.mo)[1]-1].slice(0,3):''),px+(dd-1)/Math.max(1,dim-1)*pw,py+ph+32,font(400,20),MUT,dd===1?'left':dd===dim?'right':'center');});
      const labels=d.grades.length<=14;
      subs.forEach((sub,si)=>{
        const pts=d.grades.filter(g=>(g.subject||'Nilai')===sub).map(g=>({x:px+((+g.date.slice(8,10))-1)/Math.max(1,dim-1)*pw,y:py+ph*(1-Math.min(100,Math.max(0,pct(g)))/100),v:pct(g)}));
        const cl=SERC[si%6];c.strokeStyle=cl;c.lineWidth=4;c.lineJoin='round';c.lineCap='round';
        if(pts.length>1){c.beginPath();pts.forEach((p,i)=>{if(i)c.lineTo(p.x,p.y);else c.moveTo(p.x,p.y);});c.stroke();}
        pts.forEach(p=>{
          c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,8,0,Math.PI*2);c.fill();
          c.fillStyle=cl;c.beginPath();c.arc(p.x,p.y,6,0,Math.PI*2);c.fill();
          if(labels)T(Math.round(p.v),p.x,p.y-15,font(600,20),INK,'center');
        });
      });
      y=py+ph+52;
    }
  }

  /* strengths / needs */
  if(listsH){
    [['Yang sudah bagus',gl,'#1B7A51',M],['Perlu diperkuat',nlst,'#D9822B',M+colW+56]].forEach(a=>{
      c.fillStyle=a[2];rr(a[3],y+6,8,32,4);c.fill();
      T(a[0],a[3]+24,y+32,font(600,28,1),INK);
      let yy=y+72;
      if(!a[1].length)T('–',a[3]+8,yy,F25,MUT);

  }

  /* tutor note */
  if(noteH){
    c.fillStyle=HL;rr(M,y,8,noteH-14,4);c.fill();
    T('Catatan tutor',M+26,y+30,font(600,28,1),INK);
    let ny=lines(noteL,M+26,y+74,F26,INK,36);

  }

  T('Terima kasih atas kepercayaan Bapak/Ibu.',W/2,H-38,font(400,22),MUT,'center');
  return cv;
}

function jpegToPdf(jpeg,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  push('%PDF-1.4\n');
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4]=len;
  push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');
  push(jpeg);push('\nendstream\nendobj\n');
  const content='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  const xref=len;let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length;});
  return out;
}

async function deleteSessions(ids){
  for(const id of ids){
    const s=S.sessions[id];if(!s)continue;
    if(s.invoiceId&&S.invoices[s.invoiceId]){
      const inv=clone(S.invoices[s.invoiceId]);
      inv.lines=(inv.lines||[]).filter(l=>l.sessionId!==id);
      if(inv.lines.length)await Store.put('invoices',s.invoiceId,inv);else await Store.del('invoices',s.invoiceId);
    }
    if(S.grades['g_'+id])await Store.del('grades','g_'+id);
    await Store.del('sessions',id);
  }
}
const invPaid=x=>{const i=x.invoiceId&&S.invoices[x.invoiceId];return !!(i&&i.status==='paid');};
function seriesLater(id){
  const s=S.sessions[id];if(!s||!s.seriesId)return [];
  return sessList().filter(x=>x.seriesId===s.seriesId&&x.id!==id&&(x.date+x.start)>(s.date+s.start)&&x.status!=='done'&&!invPaid(x)).sort(byTime).map(x=>x.id);

A['load-demo']=()=>loadDemo();
A['del-demo']=()=>confirmDlg({title:'Hapus data contoh?',msg:'Semua anak, sesi, nilai, dan tagihan contoh akan dihapus. Data aslimu tidak tersentuh.',yes:'Hapus data contoh',onYes:async()=>{
  const isDemo=sid=>String(sid).indexOf('demo_')===0;
  const ok=await safe(async()=>{
    for(const k of ['sessions','grades','invoices','recaps'])for(const id of Object.keys(S[k]))if(isDemo(S[k][id].studentId))await Store.del(k,id);
    for(const id of Object.keys(S.students))if(isDemo(id))await Store.del('students',id);
    return true;
  });
  if(ok){toast('Data contoh dihapus.');if(UI.route==='student'&&isDemo(UI.studentId))go('home');}
}});

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.dataset.evt==='change')return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName==='BUTTON'||el.tagName==='A')e.preventDefault();
  fn(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act][data-evt="change"]');
  if(el&&A[el.dataset.act])A[el.dataset.act](el,e);
  if(e.target.closest&&e.target.closest('.inv-form'))recalcInv();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[name=subject]'))t.dataset.auto='0';
  if(t.matches&&t.matches('[name=rsubj]'))t.dataset.touched='1';
  if(t.matches&&t.matches('[data-rep]'))repSync();
  if(t.id==='rc-note'){clearTimeout(recapTimer);recapTimer=setTimeout(paintRecap,350);}
  if(t.closest&&t.closest('.inv-form'))recalcInv();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root .modal'))closeModal();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.topic-add input')){const b=e.target.nextElementSibling;if(b)b.click();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click();}
});

async function boot(){
  render();
  let db=null;
  try{if(window.claude&&window.claude.use){const [d,dl]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('downloads').catch(()=>null)]);db=d;DL=dl;}}catch(e){}
  if(db){Store.db=db;Store.subscribe();}
  else{Store.loadLocal();Store.loading=false;render();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
}
boot();
})();
